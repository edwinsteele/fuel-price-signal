name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history, so `git diff origin/<base>...HEAD` always finds the
          # merge base. The action then fetches the PR head without a depth
          # limit, because it only deepens a checkout that is already shallow.
          fetch-depth: 0

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Review coverage. A bare `@claude review` on the stock setup got a
          # 4-turn, 16-second pass that routinely skipped the tests and docs and
          # said so (inc-setlist PR 165; fixed in inc-setlist PR 166, verified
          # on PR 167). The appended prompt makes a review
          # cover every changed file and end with a Coverage: line that the
          # ticket-to-pr gates can check. The extra tools are read-only git
          # commands the review needs; tag mode allows only git add, commit,
          # rm and push by default. Keep the prompt free of apostrophes and
          # dollar signs: it is parsed with shell quoting.
          claude_args: |
            --max-turns 60
            --allowedTools "Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git merge-base:*),Bash(git ls-files:*)"
            --append-system-prompt 'When the trigger comment asks you to review a pull request, review the whole pull request, not a sample of it.
            1. Run git diff --stat origin/BASE...HEAD and then git diff origin/BASE...HEAD, where BASE is the base branch named in your instructions. If the diff cannot be computed, say so at the top of your comment, and say the review is incomplete.
            2. Read the diff of every changed file: source, tests, docs, memory notes, configuration, workflows and agent instructions. A test or doc change is part of the change, not optional context. Read surrounding code wherever a hunk depends on it, and read AGENTS.md, CLAUDE.md and any REVIEW.md for the rules of this repository.
            3. Check that the tests exercise the behaviour the PR claims, including its failure paths, and that docs, notes and the PR description claim only what the change and its evidence show.
            4. This runner cannot build the project or run its tests. Say that once. It does not count as skipped coverage.
            5. Report each finding with file and line, a severity (blocking, non-blocking or nit) and a concrete failure scenario. If there are no blocking problems, say so in those words.
            6. End your comment with one line that starts with Coverage: and reads either Coverage: read all N changed files, or Coverage: read N of M changed files; not read: PATHS (REASON). Never leave this line out, and never claim a file was read when it was not.'
