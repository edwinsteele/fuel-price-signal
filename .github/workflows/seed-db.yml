name: Seed / reset DB

# Rebuilds fuel_signal.db from scratch from committed inputs (bulk history +
# tracked data/snapshots/**/*.csv) and publishes it as a db-<date> cache
# entry. Manual/rare: run this once to bootstrap, or again if the cached DB
# ever needs a clean reset. Daily DB update.yml restores from whatever this
# (or a prior run of it) last saved and applies incremental updates on top —
# it does not rebuild from scratch itself.
on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    permissions:
      actions: write # cache save + prune

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.14"

      - name: Build DB from scratch
        run: |
          uv run python -m fuel_signal.history
          uv run python -m fuel_signal.db --force
          uv run python -m fuel_signal.fill
          uv run python -m fuel_signal.classify --start-date 2016-08-01
          uv run python -m fuel_signal.lga_leadership --start-date 2016-08-01

      - name: Compute cache key
        id: date
        run: echo "today=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/save@v4
        with:
          path: fuel_signal.db
          key: db-${{ steps.date.outputs.today }}

      - name: Prune older db cache entries
        run: |
          gh cache list --key db- --json id,key --jq \
            '.[] | select(.key != "db-${{ steps.date.outputs.today }}") | .id' \
            | xargs -r -n1 gh cache delete
        env:
          GH_TOKEN: ${{ github.token }}
