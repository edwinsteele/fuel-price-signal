name: Daily AIP TGP fetch

on:
  schedule:
    # Must land before the ~5am Sydney price-inference run, so the freshest TGP
    # is committed first. The tgp_delta_7d feature is shift(1) — inference at day
    # T needs T-1's TGP (available since T-1 closed), not today's. 17:00 UTC is
    # ~3-4am Sydney: before 5am in both AEST (19:00 UTC) and AEDT (18:00 UTC),
    # with buffer.
    #
    # The xlsx source (fuel_signal/tgp.py) is only refreshed WEEKLY — four
    # consecutive fetches in Aug 2026 all landed on Fridays (24/31 Jul, 7/14 Aug),
    # each adding exactly 5 weekday rows — so data_lag_days climbs from 0 right
    # after a Friday refresh up to 6 by the following Thursday before resetting.
    # The daily cron still makes sense (it picks up the new file the day it
    # lands), but T-1 is NOT reliably present at this slot; the fresher
    # api.aip.com.au/public/tgpTables endpoint (~1-2 day lag) is tracked in
    # fps-3fn as a lower-latency source to backfill the gap.
    - cron: "0 17 * * *"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.14"

      - name: Fetch TGP series
        run: uv run python -m fuel_signal.tgp

      - name: Commit TGP CSV
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tgp/
          git diff --cached --quiet || git commit -m "tgp: $(date -u +%Y-%m-%d)"
          max_attempts=5
          for attempt in $(seq 1 "$max_attempts"); do
            git push && break
            if [ "$attempt" -lt "$max_attempts" ]; then
              sleep_time=$((2 ** attempt))
              echo "Push failed (attempt $attempt/$max_attempts), rebasing on remote then retrying in ${sleep_time}s..."
              # main may have advanced (e.g. a merge landed); rebase before retry
              # so the loop recovers from non-fast-forward, not just transient errors.
              git pull --rebase || echo "rebase failed; retrying push anyway"
              sleep "$sleep_time"
            else
              echo "Push failed after $max_attempts attempts"
              exit 1
            fi
          done
