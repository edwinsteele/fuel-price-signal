# Negative-results ledger
#
# Machine-readable residue of every candidate feature this project has tested.
# Consumed by the generator session (fps-3jj.7) so it does not re-propose dead
# ground and can see where room remains.
#
# Newest-first, matching experiments/INDEX.md. INDEX.md remains the prose lab
# book; this file is the structured claim record. Neither is derived from the
# other — the dossier routine writes both in the same pass.
#
# KEYED ON THE CLAIM, NOT THE FEATURE NAME. `inputs` (what data) is held
# separately from `claim` (what was asserted), because a rejected claim over a
# data source does not condemn the source: the regime-local cycle_mean_length
# denominator was rejected, but the cycle features built on the same detector
# remain locked. (This comment previously used TGP as its example — both TGP
# claims are now rejected/inconclusive, so it no longer illustrates the point.)
#
# Fields:
#   candidate   - the column(s) or change under test
#   inputs      - what data it reads
#   claim       - the mechanism asserted, in price-formation terms
#   falsified   - what the run actually showed (empty for graduates)
#   not_tested  - adjacent ground this run did NOT rule out. The field that
#                 stops the generator being timid. Requires real judgement.
#   outcome     - graduated | rejected | inconclusive | disqualified
#                 | aborted_candidate | aborted_environment
#   calibration - (optional) for runs whose job was to validate the PIPELINE
#                 rather than the candidate: whether it reproduced an
#                 independent reference, and what any discrepancy turned out
#                 to be.
#   evidence    - experiment dir
#
# `inconclusive` is NOT `rejected`. A rejected claim is dead ground the generator
# should not re-propose; an inconclusive one was measured below the instrument's
# resolution, and the ground may still be open. Read `falsified` and `not_tested`
# before deciding. First use: batch0/tgp_delta_7d, 2026-08-19 — pooled realised
# delta +0.0059 c/L against a ~0.05 c/L per-decision-flip quantum.
#
# For a batch1+ pipeline run this split is MECHANICAL, not a per-entry judgement call
# (fps-3jj.17, decided 2026-08-23): docs/routines/dossier.md § Step 1.4 writes `rejected`
# when a candidate's noise-band z is clearly the wrong sign (measurably worse than the
# batch's own noise floor) and `inconclusive` when it sits inside the band (indistinguishable
# from noise at single-candidate resolution). See that section for the exact rule and the
# `facts.json` fields it reads.
#
# Entries below 2026-08-17 were hand-backfilled from experiment READMEs and
# analysis.md files (bd fps-3jj.3). Later entries are pipeline-generated.

- candidate: station_px_change_3d, station_px_change_14d, station_descent_decel
    (a station's own cut-sequence velocity/deceleration)
  inputs: [station_code, price_date, station_price_cents]
  claim: >-
    The retail descent is a sequence of discrete cuts, and the SHAPE of a
    station's own cut sequence says how much of the descent is left -- a
    station whose recent pace has collapsed toward zero while its 14-day pace
    was steep has arrived at its floor and is exposed to the restoration. The
    lock has no station-level velocity column (every dynamic column is
    network-level), so the model should stop waiting earlier where
    station_descent_decel goes positive, concentrated in elongated cycles
    (predicted largest in folds 3 and 7) with a modest, concentrated flip
    count.
  falsified: >-
    The predicted mechanism specifically, not the columns outright. The
    pipeline's own zone test on the candidate's declared target (folds 3, 7)
    reads resolved=false: those folds show a small WORSENING
    (target_delta_cpl_own=+0.0138) while the rest of the run carries the
    improvement (other_delta_cpl_own=-0.0345). Folds 3/7 individually are
    unremarkable (-0.15 / +0.20 c/L) next to fold 13's -1.28 or fold 11's
    -0.57, neither predicted. Flip count is large and diffuse (439 across all
    14 folds, tens per fold) not modest and concentrated. What aggregate
    improvement exists traces mostly to shock-regime folds (per-regime: shock
    -0.2837 vs normal +0.0706 c/L), a mechanism never proposed. None of this
    reaches the arbiter either way -- headline -0.0272 c/L held-tau sits well
    inside batch1's own noise band (z=-0.52 vs threshold 1.92, 60th
    percentile of the noise draws).
  not_tested: >-
    Whether these columns carry a real shock-regime mechanism -- the run's
    actual (noise-indistinguishable) improvement concentrated in shock folds,
    not the elongated-normal folds the candidate was built around; a
    follow-up could re-target these columns at "has this station's own pace
    already stalled going into a shock" rather than the late-descent-shape
    story tested here. Whether the effect is real but underpowered rather
    than absent -- sitting inside the noise band is not rejection. Fold 1's
    "candidate stopped buying" shape (21 baseline-only fills, zero
    candidate-only) is untouched. Per-column attribution (which of the three
    columns is doing anything) needs SHAP interaction values on the fitted
    candidate model, which the pipeline doesn't currently persist -- same gap
    noted on network_move_breadth.
  outcome: inconclusive
  evidence: experiments/candidates/batch1/station_descent_dynamics/

- candidate: network_rise_breadth_3d, network_fall_breadth_3d, network_rise_breadth_delta_2d
    (directional network-breadth participation counts)
  inputs: [station_code, price_date, station_price_cents]
  claim: >-
    A subset of stations jumps 20-30 c/L within a day or two at the end of a cycle
    (a coordinated restoration) and the rest follow over the next few days.
    network_px_std measures cross-sectional spread and is invariant to direction;
    counting the signed share of stations moving up vs down over a fixed window
    recovers the sign that dispersion throws away, so the model can see "peers
    have started jumping" and flip WAIT->BUY one to three days earlier, in a few
    large decision flips concentrated on shock folds.
  falsified: >-
    Not resolved either way. REVISED 2026-08-24 once fps-gez's decision-flip
    attribution landed: the real per-fold flip-only CPL deltas show the
    favourable effect is NOT one outlier fold. Three CONSECUTIVE folds carry it
    -- 11 (-14.47 c/L), 12 (-14.42 c/L), 13 (-12.95 c/L) -- a sustained pattern,
    not a single lucky catch. But only fold 13 of those three is a SHOCK fold;
    11-12 are "normal", so the concrete wins are calendar-adjacent, not
    regime-adjacent, contradicting the predicted shock-restoration mechanism
    even though the coarser per-regime aggregate (shock -0.3065 vs normal
    -0.0925 c/L) still nominally points the predicted way. The headline
    realised delta (-0.1552 c/L held-tau) still sits inside batch1's
    single-candidate noise band (z=-1.80 vs threshold 1.92, arity-3 floor).
  not_tested: >-
    Why folds 11-13 specifically: a real calendar-clustered event these columns
    caught regardless of SHOCK_FOLDS labelling, or within the range noise would
    produce at this fold count (the batch's noise floor is pooled, not
    per-fold, so it can't answer this directly). Whether network_fall_breadth_3d
    actually pushes WAIT longer as predicted, or is inert/reinforcing (needs
    per-column attribution, e.g. SHAP interaction values -- needs the candidate
    model persisted, which the pipeline doesn't currently do; deliberately not
    built as part of fps-gez). Fold 9's different shape (8 candidate-only fills,
    zero matched baseline-only -- more frequent buying, not swapped timing) is
    untouched. Whether combining this with lga_trough_propagation (same batch,
    same cross-sectional-consensus family) does better than either alone.
  outcome: inconclusive
  evidence: experiments/candidates/batch1/network_move_breadth/

- candidate: per-zone economics cut on a ROW LABEL rather than on folds (per_axis
    delta_cpl_own, CONFIDENCE_ZONE graded on a candidate's own add_axis)
  inputs: [realised fill ledgers, any per-row grouping label a candidate declares]
  claim: >-
    A candidate can declare an arbitrary per-row axis (add_axis: day-of-week, TGP
    direction, competition density, cycle amplitude, brand class...) and the
    pipeline will grade "the effect concentrates where TARGET says" by pooling
    realised CPL within each axis label.
  falsified: >-
    Not for a COST axis. Pooled CPL is a tank-path total, so cutting it on a
    row-level label allocates a path-coupled cost to a sub-period, which has no
    unique answer -- the same defect that withdrew every per-zone row of #262.
    The fold-based cuts the pipeline uses by default (per_fold, and per_regime =
    SHOCK_FOLDS, a grouping of WHOLE folds) are safe for the opposite reason,
    and the reason is mechanical rather than a judgement call: realised.py calls
    aggregate_backtest once per fold and aggregate_backtest calls run_backtest
    once per station with a fresh tank, so each (fold, station) is an independent
    simulation and a fold-cut number is a sum of complete windows. A row label is
    a slice through one. Not yet triggered in any published dossier -- batch0
    declared no add_axis, so per_axis is null in the only facts.json on disk --
    but it is wired in, and CONFIDENCE_ZONE resolves a SCORED PRIOR off it, so an
    unidentified number would propagate into the cross-batch calibration record.
  not_tested: >-
    Whether a per-row axis can carry a NON-cost claim safely. It can, and this is
    the constructive route: quantities natively stamped at a moment (per-row
    log-loss, per-decision accuracy, "did the model pick a worse week than the
    oracle?", buy/wait agreement rates) are unaffected by path coupling and may
    be cut on any label. A candidate that wants a row-label zone claim should
    make it on one of those, or express the zone as a set of folds. Whether the
    min_row_cell_n guard should be raised for axis cells specifically -- it
    guards thin cells, not unidentified ones, and does nothing here.
  outcome: disqualified
  evidence: experiments/2026-08-21_path_coupling_audit/

- candidate: realised saving% by cycle regime (purchase-event attribution against a
    regime-matched always-buy denominator)
  inputs: [model/always-buy realised fill ledgers, cycle_pct_through]
  claim: >-
    Realised buyer economics is materially worse in the late-descent / elongated
    zone than in normal rows (#259 gate 1), measurable as saving% vs a
    regime-matched always-buy baseline with every fill tagged by the cycle regime
    at its fill date.
  falsified: >-
    The QUANTITY, in both directions -- the Layer-2 gradient (normal 0.64% /
    late_descent 2.13% / overdue 4.06%) AND the Layer-3 chosen-only reading that
    overturned it (11.45% / 6.45% / 11.03%, flat CPL 174.5 / 176.4 / 174.9).
    Realised CPL is a tank-path total, so tagging a fill by the regime at its own
    date allocates a path-coupled cost to a sub-period -- no unique answer, the
    same defect that withdrew #262's per-zone rows. Demonstrated on the committed
    numbers alone, no re-run: emergency-fill inclusion is a free bookkeeping
    convention (Layer 2 includes forced fills, Layer 3 excludes them; both
    defensible, nothing physical decides it) and is the path-coupling carrier in
    its purest form, since an emergency fill stamped in `normal` settles a wait
    chosen in another regime. Spread ACROSS that one convention is 21.30 / 8.15 /
    13.69 c/L per bucket against a spread BETWEEN buckets of 6.73 (all fills) and
    10.40 (chosen only) -- larger on every bucket -- and the ordering REVERSES,
    best-to-worst going overdue,late_descent,normal to normal,overdue,late_descent.
    Worse coupled than #262's: the arms' denominators are wholly unpaired (always-buy
    fills every evaluation date, so its per-regime litres bear no relation to the
    model's; the attribution experiment measured ~30% fill-count differences under
    purchase-event attribution vs 0.0-1.7% litre differences under consumption-interval),
    and realised_by_regime.csv stores no always_litres, so the pairing is not even
    checkable from the committed record. Measured against always-buy rather than an
    oracle, it produces no impossible negatives -- the defect is SILENT, and absence
    of negatives was never evidence of safety. STANDS: the Layer-1 proxy regret
    (1.05 / 1.72 / 1.32), a per-row TP/FP/FN classification score with no tank and
    no path; the Layer-3 DIAGNOSIS that emergency dilution plus a regime-varying
    always-buy denominator drove the gradient (strengthened, not withdrawn); the
    overdue drop censor; and "always-buy is the wrong yardstick".
  not_tested: >-
    Whether the regime axis carries realised economics at all -- it has never been
    measured with an identified instrument, in EITHER direction, so this is an open
    question rather than a closed one. Note what this does to fps-x0f: of its three
    mutually-inconsistent late-descent findings, the two that DISAGREED WITH EACH
    OTHER are now both withdrawn (this entry, and #262's per-regime headroom), leaving
    one un-contradicted proxy reading which says late descent is the WORST zone --
    cut, however, on the known-defective expanding-mean cycle_mean_length axis. Also
    still untested: whether a measure that never allocates cost to a period (decision
    timing vs the oracle, week-choice agreement) can carry the regime comparison
    instead; that is the fps-x0f step-2 redirect and it is unchanged.
  outcome: disqualified
  evidence: experiments/2026-06-18_late_descent_gate1/ (withdrawn by
    experiments/2026-08-21_path_coupling_audit/)

- candidate: evaluation cadence (TankParams.evaluation_interval_days) as a free parameter
  inputs: [station daily prices, model/oracle realised fill ledgers]
  claim: >-
    #262's window-level headroom of 1.66 c/L -- the number that justified "the
    model is near the perfect-foresight floor, stop doing feature work" -- is an
    artifact of the 7-day decision grid, which is a TankParams default rather than
    a fact about the world. A finer grid should expose within-week dips the weekly
    grid cannot see, so the true ceiling should sit well below 188.14.
  falsified: >-
    The "near the floor" judgement, not the measurement. Headroom nearly DOUBLES at
    daily cadence: 1.54 -> 2.97 c/L (7d always 193.41 / model 189.67 / oracle
    188.14; 1d 192.99 / 187.82 / 184.85). Robust -- grew in 12/14 folds, median
    +1.70. Also falsified: "~250 real decisions, hence structurally small feature
    effects" as a property of the TANK. Forced-fill COUNT is cadence-invariant
    (508/499/500) because hitting the floor depends on distance driven, not on how
    often you look; chosen fills go 244 -> 896 -> 1832. So that explanation, and
    the ~0.05 c/L decision-flip quantum built on it, are 7-DAY quantities. Also
    falsified: #262's model CPL of 189.79 does not reproduce (189.67 on the current
    features.csv vintage; always-buy and oracle match to the cent, both being
    price-only), so 7d headroom is 1.54 not 1.66.
  not_tested: >-
    Whether the extra headroom is RECOVERABLE -- the ceiling is leaky by
    construction, so 2.97 is an upper bound on a partly-unforecastable prize.
    Whether re-picking tau against daily-cadence economics captures part of it with
    NO new features: tau was held at the production 0.25 at every cadence (correct
    for isolating the cadence effect), so the daily arm is the production model
    operated as-is, not tuned for 7x more decisions. This is the cheapest untested
    move and should precede any feature work. Whether the model's plateau past 2d
    (189.67 -> 187.85 -> 187.82, i.e. 0.03 c/L for doubling its chances, while the
    oracle keeps improving) is a signal-content limit or an operating-point limit
    -- the tau sweep above is what separates those. Whether cadences between 2d and
    7d behave differently: 3/4/5/6 are all DISQUALIFIED by the engine defect below,
    not merely unrun. Whether any OTHER repo result was measured at a cadence whose
    lattice makes the engine's run-dry clamp reachable.
  outcome: rejected
  evidence: experiments/2026-08-20_cadence_ceiling/

- candidate: run_backtest's run-dry clamp vs run_oracle_backtest's run-dry pruning
  inputs: [tank dynamics only -- no price or feature data]
  claim: >-
    Sweeping TankParams.evaluation_interval_days is a free knob, so oracle-vs-model
    headroom can be compared at any cadence.
  falsified: >-
    It is not free. run_backtest clamps a tank that would go negative to 0 and
    continues (its emergency rule tests the CURRENT level, not the post-depletion
    overshoot, despite its own comment saying it exists "to avoid running dry before
    next evaluation"), while run_oracle_backtest prunes run-dry paths outright. So
    the oracle is a ceiling only over NEVER-DRY strategies, and whether the model
    stays never-dry depends on the reachable level lattice, which depends on
    D = daily x interval. At 3-day cadence a reachable level (7.14 L) sits ABOVE the
    10% emergency floor yet cannot survive a 10.71 L interval: the model strands the
    tank and understates its CPL denominator on exactly the paths where waiting
    looked cheapest. Measured: 109 dry events / 389 L at 3d (worst single event
    3.571 L = one day's burn); at one-fold scale headroom went to -1.47, impossible
    for a true ceiling. Exact rational arithmetic over the lattice: cadences 1, 2
    and 7 are safe on the default tank; 3, 4, 5, 6 and 8-14 are not.
  not_tested: >-
    Whether the proposed fix (emergency fires when `tank_level < depletion`, i.e.
    test what the comment claims) is truly a no-op on the default 7-day lattice
    {0, 25, 50}. It is a no-op by DERIVATION at 7d/2d/1d -- identical decision at all
    29 reachable levels -- but that has not been EXECUTED. The merge gate is that 7d
    must reproduce 193.41 / 189.67 / 188.14 exactly; if it does not, the cadence
    experiment's conclusions are retracted rather than patched. RESOLVED 2026-08-20
    (was: has any other repo result been measured at an unsafe cadence?) -- the
    committed record is clean, every harness result runs TankParams() = 7d, no doc
    quotes a non-default-cadence number, and the default has been 7 throughout the
    knob's git history. But the audit found README.md:756's documented CLI example
    (--tank-size 60 --daily-use 4.5 --eval-interval 7) IS unsafe: D = 31.5 L and the
    engine starts at 30 L, so the starting level itself is in the gap and the first
    wait strands the tank. Every strategy except always-buy, silently. Folded into
    fps-5mn, which was raised to P1; note a lattice-only validator would MISS it,
    since the offending level is the start level rather than a wait-chain rung.
  outcome: disqualified
  evidence: experiments/2026-08-20_cadence_ceiling/

- candidate: per-zone headroom attribution (consumption-interval + bootstrap CIs)
  inputs: [model/oracle realised fill ledgers, cycle_pct_through, network_px_std]
  claim: >-
    The #262 headroom map's impossible negative cells are attribution artifacts
    (unpaired denominators + path coupling), so re-attributing cost to the
    consumption interval instead of the purchase event, and adding bootstrap CIs,
    will make per-zone headroom trustworthy enough to drive feature decisions.
  falsified: >-
    The ESTIMATOR fix works but the QUANTITY is not identified. Per-zone headroom
    depends on two free bookkeeping conventions with no physical content -- cost
    basis (fifo/average) and interval label (start/mid/end) -- and across those 6
    combinations each zone moves MORE than the zones differ from each other.
    Regime per-zone spread 2.53-2.95 c/L vs between-zone 0.90-3.36; the "worst
    zone" changes three times. Volatility is worse: >=16c spans -0.11..5.02
    (spread 5.13). No contrast separates on either axis (best late_descent>normal
    p=0.90, CI [-0.77,+3.49]; 12-16c vs >=16c p=0.42). Impossible negatives are
    not robustly removed either -- absent at `start` labelling, back at
    average/end and average/mid (3 of 42 grid cells). This CANNOT be fixed with
    more data: convention spread is a bias/identification term, not variance.
    Consequence: every per-zone row of #262 is withdrawn -- "regime axis FLAT"
    (which rested the late-descent thread), the 12-16c hump's magnitude and peak
    status, monthly episode clustering, and the +/-0.5 per-band noise floor that
    was derived from the negatives.
  not_tested: >-
    Whether a measure that never allocates cost to a period -- e.g. decision-
    timing accuracy, "did the model pick a worse week than the oracle?" -- can
    carry the zone comparison instead. That is the redirect for fps-x0f step 2.
    Whether the window-level 1.66 c/L ceiling itself moves under a finer
    evaluation cadence (the 7-day interval is a TankParams default, not a fact
    about the world; the oracle is fit-free so this is cheap to resize).
    RESOLVED 2026-08-21 by experiments/2026-08-21_path_coupling_audit/ (bd
    fps-grp) (was: whether any OTHER path-coupled quantity in the repo is sliced
    by period the same way) -- 6 at-risk, 10 safe. The 2026-06-18 gate1
    per-regime realised saving% is the same defect and is now withdrawn (entry
    below); results.csv, evaluate.py, score_phase2.py and every per-fold /
    per-fold-group economics figure are safe, because a fold is an independent
    simulation with its own tank rather than a slice through one. Live
    prospective risk is in the AI-feature pipeline (per_axis deltas +
    CONFIDENCE_ZONE on a candidate add_axis row label) -- see the entry below.
  outcome: rejected
  evidence: experiments/2026-08-20_headroom_attribution/

- candidate: tgp_delta_7d
  inputs: [tgp_delta_7d]
  claim: >-
    7-day AIP Sydney TGP (wholesale floor) momentum predicts near-term retail
    descent, concentrating in shock regimes where today's wholesale-floor
    position alone misleads. Run as batch0's PIPELINE CALIBRATION check —
    the question was whether the pipeline reproduces an independently written
    script on the same inputs, not whether the feature earns a place in
    FEATURE_COLUMNS.
  falsified: >-
    Nothing about the world. Pooled realised delta_cpl_held = +0.0059 c/L
    (R0 189.6717 -> candidate 189.6776): inert. What IS falsified is the
    June 2026 graduation figure of -0.039 c/L — it does not reproduce on the
    2026-08-10 snapshot with identical columns, folds and seed, and it was
    never resolvable in the first place. One buy/wait decision flip is worth
    ~0.05 c/L pooled, LARGER than the -0.039 that graduated the feature.
    Per-fold pooled contributions span -0.209 to +0.654 c/L for that +0.006
    total (largest fold ~110x the pooled result, near-total cancellation);
    the two arms differ on 11 of 752 fills. WFCV log-loss favours the
    candidate (delta_ll_all -0.0137, hard25 -0.0646) and disagrees with the
    realised headline, as it did in June. Against the noise floor (fps-3jj.9,
    PR #311, run against batch0 2026-08-19: 5 R0-vs-R0 paired-seed draws, mean
    -0.0135 c/L, std 0.142 c/L), this candidate's +0.00585 c/L sits at the
    40th percentile (z=+0.14) — squarely inside pure fit noise, confirming
    "inert" rather than just asserting it.
  calibration: >-
    PASSED. The pipeline returned delta_cpl_held +0.005851 against an
    independent reference of +0.0059 from
    diagnostic_baseline_composition.py — R0 189.6717090069284 and candidate
    189.6775604142693, matching to every printed digit. The reference predates
    the fix that made the run possible, uses a different script and a different
    feature-injection path (.asof provider vs add_columns + exact-key lookup,
    822 hits / 88 misses), so the 88 misses again never touch a live decision.
    Took three attempts; both failures were defects in the CONTRACT, not the
    pipeline. (1) fps-sa1 / PR #309: R0 carried the 10 Phase 4b brand-trough
    columns REJECTED on 2026-06-02, because resolve_baseline_columns()
    discovered them from the features header (+0.0941). (2) fps-zci / PR #310:
    the corrected 54 columns were returned SORTED while the locked artifact is
    in group order, differing in 52 of 54 positions; LightGBM breaks equal-gain
    split ties by feature index, so a permutation fits a different model
    (+0.0439). Attribution of the original -0.0394 -> +0.0941 swing: wrong
    column set +0.0882, data vintage +0.0453; column order accounts for a
    further 0.038 between the two 54-column runs. Each is about one decision
    flip.
  not_tested: >-
    Why the 54-col baseline improved 0.1206 c/L between June's vintage and the
    2026-08-10 snapshot (always_cpl identical to the decimal, feature code
    barely changed; plausible mechanism is gap-fill adding historical rows for
    stations outside the 50 preferred, feeding the LGA/network/stickiness
    aggregates — unproven). Fold 2's +1.147, the current largest contributor:
    not investigated, and on this evidence not worth it — the dominant fold's
    identity changed with every contract fix, which is a property of the
    metric rather than of any fold. The fps-3jj.8 retrospective acceptance
    criterion (not yet built) that would formally rank a candidate against the
    noise band rather than eyeballing a percentile.
  outcome: inconclusive
  evidence: experiments/candidates/batch0/tgp_delta_7d

