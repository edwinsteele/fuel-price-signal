- candidate: station_minus_tgp_cents
  inputs: [AIP Sydney ULP terminal gate price, station price]
  claim: >-
    Distance to the wholesale floor predicts remaining descent — troughs "kiss"
    TGP, so a large gap means more fall to come.
  falsified: >-
    Helps calm (Dll_all -0.012) but HURTS shock (+0.011) — inverse of the
    hypothesis. Today's TGP is accurate when the floor is stable and misleading
    when it is moving. On the realised arbiter it pools better than vel7 alone
    (-0.136 vs -0.039) but by the WRONG TRADE: it rescues low-headroom calm folds
    while zeroing vel7's biggest gains in the expensive 200+ c/L folds, where the
    #262 headroom actually lives. The floor-proximity brake cancels velocity's
    pre-spike buy.
  not_tested: >-
    Velocity/acceleration of the floor — became tgp_delta_7d, which was measured
    INERT in batch0 (see entries above); the pivot to velocity did not rescue the
    series. A gap measured against a *forward-looking* floor rather than today's.
    Whether the gap is usable when explicitly gated OFF during shock regimes
    rather than tamed by an interaction. AND THE OPEN ONE: whether the gap helps
    on LATE-DESCENT rows specifically. It was rejected on the SHOCK axis, which
    is not the axis its mechanism targets — the same oracle diagnostic that fed
    this rejection also measured gap -> depth-remaining at r2=0.63 (vs
    gap -> days 0.47, gap/slope 0.19), and "how much further is there to fall"
    is precisely the late-descent question. That regime-segmented test was never
    run, for the gap or for velocity.
  outcome: rejected
  evidence: experiments/2026-06-20_leading_indicators/

- candidate: gap_x_vel7 (explicit interaction of TGP gap and TGP velocity)
  inputs: [AIP Sydney ULP terminal gate price, station price]
  claim: >-
