- candidate: non-parametric phase lookup, E[norm_price | phase] per fold
  inputs: [cycle_pct_through, station_price_cents, cycle_last_min_cents, cycle_last_max_cents]
  claim: >-
    Replacing the linear-interp diagonal projection with a learned per-fold
    empirical shape fixes the predecessor's shock-fold fragility — the problem was
    shape misspecification, not the concept.
  falsified: >-
    Shape correction was REAL but did not flip the verdict (fold 9 improved +0.101
    -> +0.066). Two separate failures: additive (51 feat) is EXACTLY neutral
    (normal-fold median +0.0004), meaning the residual adds nothing the sibling
    features do not already carry — trees were already building phase-residual-like
    splits. And ablationA (drop siblings, add lookup) regresses badly, because the
    siblings are pct-invariant anchors ("n cents above the recent trough" regardless
    of whether the cycle ran 25 or 50 days) and the lookup is not. Mechanism is a
    triple-stack that only aligns in fold-9-like windows: late descent is the
    model's hardest zone, the lookup is structurally noisy in the pct>1 tail, and
    cycle elongation pushes trough-proximity INTO that tail. The tail is also
    selection-biased — rows with pct>1.5 exist only for cycles that ran 1.5x
    without re-peaking, i.e. prior shock episodes, which do not generalise to new
    ones.
  not_tested: >-
    Nothing on the diagonal-projection axis is worth retesting — the track is
    closed, including clip-point sensitivity. The durable constraint for anything
    downstream: no phase-residual variant should be pursued without an architecture
    that PRESERVES the absolute anchors. Left genuinely open: the
    stickiness x cycle_pct_through opposite-orientation saddle, surfaced
    unexpectedly in step 1 and never pursued.
  outcome: rejected
  evidence: experiments/2026-06-05_phase_lookup_nonparametric/

- candidate: station_price_cents minus interp(trough, peak, cycle_pct_through)
  inputs: [cycle_pct_through, station_price_cents, cycle_last_min_cents, cycle_last_max_cents]
  claim: >-
    cycle_pct_through x cents features show a ~10% partner-score plateau and clean
    SHAP saddles, so engineering the implicit interaction explicitly should absorb
    it and let the sibling features be dropped.
  falsified: >-
    Additive neutral; ablationA regresses 10/14 folds (mean +0.018, worst +0.101 in
    fold 1 late-2021 surge and +0.097 in fold 9 Israel-Gaza onset). The diagonal
    projection drops absolute-anchor information the siblings preserve via per-anchor
    distances. Passed on a single val window and reversed under paired CV —
    a sign-flip precedent worth remembering.
  not_tested: >-
    station_minus_sydney_avg_cents as a redundancy-drop candidate: step 1 found it
    had the HIGHEST partner score but the LOWEST true SHAP interaction, making it a
    cleaner drop candidate than the engineered feature ever was. Same protocol,
    ~2 min compute, never run.
  outcome: rejected
  evidence: experiments/2026-06-04_cycle_pct_through_interaction/

- candidate: drop station_price_cents or station_minus_last_max_cents (SHAP-redundant pair)
  inputs: [station_price_cents, cycle_last_max_cents]
  claim: >-
    The pair is SHAP-redundant, so removing either should be neutral and buy a
    smaller feature set.
  falsified: >-
    drop_price is out immediately (sign flips across seeds). drop_minus_max looked
    real on a single window (paired D -0.011 +/- 0.004) but under 14-fold CV wins
    only 7/14 with mean +0.010 and two folds regressing >+0.05 (fold 4 +0.066,
    fold 9 +0.103). Regime-sensitive, not safe to drop. The general lesson: SHAP
    correlation measured on ONE training run conflates "redundant in this regime"
    with "redundant globally".
  not_tested: >-
    What station_minus_last_max_cents provides specifically in fold 9
    (2023-10 -> 2024-01) that the other 49 features cannot reconstruct — a +0.103
    regression on 60k rows was never diagnosed. Whether the feature flips MECHANISM
    across regimes (mean-reversion vs cycle-decoder), which would explain the
    fold-by-fold sign flip.
  outcome: rejected
  evidence: experiments/2026-06-03_drop_redundant_pair/
