  outcome: graduated
  evidence: experiments/2026-06-20_leading_indicators/

- candidate: station_minus_tgp_cents
  inputs: [AIP Sydney ULP terminal gate price, station price]
  claim: >-
    Distance to the wholesale floor predicts remaining descent — troughs "kiss"
    TGP, so a large gap means more fall to come.
  falsified: >-
    Helps calm (Dll_all -0.012) but HURTS shock (+0.011) — inverse of the
    hypothesis. Today's TGP is accurate when the floor is stable and misleading
    when it is moving. On the realised arbiter it pools better than vel7 alone
    (-0.136 vs -0.039) but by the WRONG TRADE: it rescues low-headroom calm folds
    while zeroing vel7's biggest gains in the expensive 200+ c/L folds, where the
    #262 headroom actually lives. The floor-proximity brake cancels velocity's
    pre-spike buy.
  not_tested: >-
    Velocity/acceleration of the floor — became tgp_delta_7d, which graduated.
    A gap measured against a *forward-looking* floor rather than today's. Whether
    the gap is usable when explicitly gated OFF during shock regimes rather than
    tamed by an interaction.
  outcome: rejected
  evidence: experiments/2026-06-20_leading_indicators/

- candidate: gap_x_vel7 (explicit interaction of TGP gap and TGP velocity)
  inputs: [AIP Sydney ULP terminal gate price, station price]
  claim: >-
    An explicit product column lets the tree tame the raw gap's shock drag,
    recovering the gap's calm-regime value without paying its shock cost.
  falsified: >-
    It does tame the drag (shock -0.009 vs gap-alone +0.011) but the pooled gain
    is marginal (+0.003) and seed-unstable (fold 11 at 30.6x the cohort-median
    seed std). Dropped — not enough signal to survive its own variance.
  not_tested: >-
    A regime-gated switch (use gap only when |tgp_delta_7d| is below a threshold)
    rather than a multiplicative interaction. The interaction was tested at one
    parameterisation only.
  outcome: rejected
  evidence: experiments/2026-06-20_leading_indicators/

- candidate: cycle_mean_length (regime-local break-floored shrunk median denominator)
  inputs: [cycle peak/trough history, price_date]
  claim: >-
    cycle_mean_length is an expanding all-history mean that averages across the
    COVID structural break (~28d -> ~41d at 2020-03), inflating cycle_pct_through
    ~13%. A regime-local denominator corrects the phase axis and should improve
    normal-fold log-loss without regressing fold 7.
  falsified: >-
    The denominator IS genuinely more accurate (~27d -> 38d, PIT-monotone, removes
    the ~1.15x fold-7-era inflation) but buys no realised value: at the held
    tau=0.25 it is 0.51 c/L WORSE (185.83 vs lock 185.32). The apparent +0.29pp
    win was the operating-point move (tau 0.25 -> 0.20 buys ~1.08 c/L), not the
    feature — operating point dominates the feature ~2x. Deeper finding: accuracy
    != objective. The model wants a decision variable, not a ruler, and the
    expanding mean's errors are economically informative. A follow-up tau-sweep
    over saved row predictions showed the two rulers are near decision-twins (both
    peak at tau ~0.21; fold 7, where they diverge most in value, has the LOWEST
    decision disagreement of all 14 folds at 1.3%) — the effect is not hiding in
    any regime.
  not_tested: >-
    Whether tau itself should be regime-dependent — the operating point was worth
    ~2x the feature effect and was never explored on its own. Designing a phase
    feature against the CPL objective directly rather than against estimator
    accuracy. (The dual-denominator idea — hand the model both rulers, whose
    difference is the elongation signal — was explicitly considered and rejected:
    it presumes an uncaptured clock signal the tau-sweep showed is already
    captured by the expanding mean's drift.)
  outcome: rejected
  evidence: experiments/2026-06-16_regime_cycle_length/

- candidate: is_post_covid (regime dummy)
  inputs: [price_date]
  claim: >-
    Handing the tree an explicit post-break flag substitutes for fixing the
    cycle-length denominator — the model can learn the regime split itself.
  falsified: >-
    Inert. Normal-fold median Dh25 ~0, Dall ~0, fold 7 +0.0054. The tree gains
    nothing from being told the break exists.
  not_tested: >-
    A continuous regime clock rather than a binary flag. Note the sibling finding
    that cycle_mean_length's own slow drift (24d -> 38d) already acts as a
    calendar/regime covariate, which likely explains the dummy's inertness.
  outcome: rejected
  evidence: experiments/2026-06-16_regime_cycle_length/

- candidate: A_x_shallow_elong, A_x_other, A_x_smooth
  inputs: [network_px_std, elongation_ratio, cycle_descent_slope_so_far]
  claim: >-
    A (network_px_std) misreads in the shallow-elongated corner. The tree has the
    ingredients but cannot assemble the conditional through three nested splits on
    ~8% of train data, so handing it the product explicitly should close the fold-7
    regression in one split.
  falsified: >-
    All three columns fail gates 1 and 2, and fold 7 got WORSE (+0.018 to +0.040),
    not flat. That is the decisive read: a noise signal would be ignored and stay
    flat; a MISLEADING signal gets used and backfires. So the failure is
    signal-availability in its strong form — A's reading in the corner is actively
    misleading, not merely absent. Rules out the representation hypothesis and
    confirms the #214 oracle diagnostic's pessimistic read. Not a seed artifact
    (fold 7's seed_std unflagged; median worse than mean, so most seeds agree).
  not_tested: >-
    Whether any OTHER intra-series signal carries the shallow-vs-steep-within-
    elongated distinction — the oracle diagnostic tested A specifically and is
    silent about trough-proximity, cross-LGA/brand late-descent consensus, or the
    triplet's B and C re-examined in this corner. (The sweep that would have
    answered this was PARKED with invalid results — see
    experiments/2026-06-14_corner_oracle_sweep/ — so this ground is genuinely
    open, not merely unexplored.) LightGBM monotone constraints on A conditional
    on regime, considered and not run.
  outcome: rejected
  evidence: experiments/2026-06-11_interaction_column/

- candidate: elongation_ratio + cycle_descent_slope_so_far (R_raw)
  inputs: [cycle_days_since_peak, cycle_mean_length, station_price_cents, cycle_last_max_cents]
  claim: >-
    Giving the model the two axes that define the shallow-elongated corner lets it
    carve out the regime and condition A's contribution there, closing fold 7.
  falsified: >-
    Fails gates 1 and 2 (fold 7 +0.0092, worst fold +0.034). The oracle diagnostic
    on the train-only segment explains why: A's level DOES separate elongated from
    normal from phase 0.2 onward (~2c gap), but shallow vs steep WITHIN elongated
    is invisible in A until phase > 1.4 — and phase >1.4 is far too late to be
    useful for prediction. R_raw's aggregate "help" comes from the
    elongated-vs-normal distinction, which is the wrong target: steep-elongated
    rows do not need different treatment, so R_raw suppresses A on all elongated
    rows, helping shallow and hurting steep by roughly the same amount.
  not_tested: >-
    A phase-conditional residual construction, A_residual = A - E[A | phase]
    ("is A unusual for its phase?" rather than "is A high?"), noted in the analysis
    as constructible PIT-safely from a rolling per-phase median but never run. It
    would surface elongated-vs-normal cleanly, though the analysis predicts it does
    not solve shallow-vs-steep. Only 8 shallow cycles exist in train, so the deep
    elongation tail is noisy — a larger training span might change the read.
  outcome: rejected
  evidence: experiments/2026-06-09_shallow_elongated/

- candidate: is_extended_shallow_descent (R_composite, single binary regime flag)
  inputs: [elongation_ratio, cycle_descent_slope_so_far]
  claim: >-
    A single binary corner indicator is enough — the model just needs to know the
    regime exists.
  falsified: >-
    Null result. Net population Dll ~-0.0001, no fold-7 movement at all. Rules out
    "model doesn't know the regime exists" as the explanation, and reframes the gap
    as "model doesn't know how to use A differently inside it".
  not_tested: >-
    Nothing adjacent survives this — the follow-up (explicit interaction column)
    was run and also failed, and worse. See the A_x_shallow_elong entry.
  outcome: rejected
  evidence: experiments/2026-06-09_shallow_elongated/

