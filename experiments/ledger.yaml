    though the zone/mechanism read is now confirmed.
  not_tested: >-
    Whether the propagation-wave mechanism holds with fold 13 excluded --
    the confirmed zone above rests entirely on it: excluding fold 13
    (litre-weighted, against the actually-persisted fills.parquet) flips
