    closed, including clip-point sensitivity. The durable constraint for anything
    downstream: no phase-residual variant should be pursued without an architecture
    that PRESERVES the absolute anchors. Left genuinely open: the
    stickiness x cycle_pct_through opposite-orientation saddle, surfaced
    unexpectedly in step 1 and never pursued.
  outcome: rejected
  evidence: experiments/2026-06-05_phase_lookup_nonparametric/

