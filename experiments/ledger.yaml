# Negative-results ledger
#
# Machine-readable residue of every candidate feature this project has tested.
# Consumed by the generator session (fps-3jj.7) so it does not re-propose dead
# ground and can see where room remains.
#
# Newest-first, matching experiments/INDEX.md. INDEX.md remains the prose lab
# book; this file is the structured claim record. Neither is derived from the
# other — the dossier routine writes both in the same pass.
#
# KEYED ON THE CLAIM, NOT THE FEATURE NAME. `inputs` (what data) is held
# separately from `claim` (what was asserted), because a rejected claim over a
# data source does not condemn the source: the regime-local cycle_mean_length
# denominator was rejected, but the cycle features built on the same detector
# remain locked. (This comment previously used TGP as its example — both TGP
# claims are now rejected/inconclusive, so it no longer illustrates the point.)
#
# Fields:
#   candidate   - the column(s) or change under test
#   inputs      - what data it reads
#   claim       - the mechanism asserted, in price-formation terms
#   falsified   - what the run actually showed (empty for graduates)
#   not_tested  - adjacent ground this run did NOT rule out. The field that
#                 stops the generator being timid. Requires real judgement.
#                 Every line must say whether the test is POSSIBLE, not just
#                 that it was not done (fps-1p1): measurable now (name the
#                 artifact), blocked on a named artifact, or permanently
#                 untestable by this pipeline. "Pending" and "never" send the
#                 generator in opposite directions, so conflating them is a
#                 defect, not a nuance. Check any cited bead's CURRENT status
#                 and close reason before writing it in.
#   outcome     - graduated | rejected | inconclusive | disqualified
#                 | aborted_candidate | aborted_environment
#   calibration - (optional) for runs whose job was to validate the PIPELINE
#                 rather than the candidate: whether it reproduced an
#                 independent reference, and what any discrepancy turned out
#                 to be.
#   evidence    - experiment dir
#
# `inconclusive` is NOT `rejected`. A rejected claim is dead ground the generator
# should not re-propose; an inconclusive one was measured below the instrument's
# resolution, and the ground may still be open. Read `falsified` and `not_tested`
# before deciding. First use: batch0/tgp_delta_7d, 2026-08-19 — pooled realised
# delta +0.0059 c/L against a ~0.05 c/L per-decision-flip quantum.
#
# For a batch1+ pipeline run this split is MECHANICAL, not a per-entry judgement call
# (fps-3jj.17, decided 2026-08-23): docs/routines/dossier.md § Step 1.4 writes `rejected`
# when a candidate's noise-band z is clearly the wrong sign (measurably worse than the
# batch's own noise floor) and `inconclusive` when it sits inside the band (indistinguishable
# from noise at single-candidate resolution). See that section for the exact rule and the
# `facts.json` fields it reads.
#
# Entries below 2026-08-17 were hand-backfilled from experiment READMEs and
# analysis.md files (bd fps-3jj.3). Later entries are pipeline-generated.

- candidate: methodology -- the realised arbiter's replay POPULATION (no feature under
    test; batch1/tgp_cycle_displacement as the specimen). Sampler is
    experiments/lib/universe.py, landed PR #361.
  inputs: [batch1 frozen fuel_signal.db (daily_prices coverage, council, Sticky share),
    features.parquet, _plan_folds' real 14 val windows]
  claim: >-
    Two claims, from fps-nas. (1) COST: per fold per arm the expensive work does not
    scale with the replay universe -- _train_calibrate_select_tau fits a full LGBM on
    all 714 stations' fold-train plus a walk-forward OOF loop, while only load_history
    and the aggregate_backtest tank walk scale -- so 5 -> 200 stations multiplies the
    cheap part only. Stated in the bead as structural, never measured, and doubted in
    writing before the run: ModelStrategy.decide does ONE single-row predict_proba per
    station-day, so a 200-station 90-day fold is 18,000 sklearn calls per arm.
    (2) HOMOGENEITY: a feature that helps Sydney-wide helps at the five commute
    stations, so one arbiter can grade broadly and report narrowly. Prior support was
    thin and on the wrong statistic (fps-e6i: per-row LOG-LOSS gain at the five sits
    0.33 SE from network-wide, which is not CPL homogeneity).
  falsified: >-
    Claim 2 UPHELD; claim 1's CONCLUSION upheld but BOTH HALVES OF ITS MECHANISM WRONG.
    (1a) The 18,000-call doubt was physically correct: replay is dead linear in station
    count, 38.4x cost for 40x stations, ~0.058 s/station-fold. It only fails to matter
    because it starts at 0.30s. (1b) load_history DOES NOT SCALE -- 28.3s at n=5 vs
    27.4s at n=200 across a 40x widening -- though the bead named it as one of the two
    scaling terms. The fixed cost is fit + history ~= 71s, not fit's 44.1s alone, and
    stations are charged only through replay. Net: 40x stations = +14% wall clock;
    measured at the 410-station census, 72 s/arm-fold vs 48 at five.
    (2) Homogeneity holds on every axis measured. tgp_cycle_displacement pooled
    delta_cpl_held: five -0.2077 c/L, broad(410) -0.1292 c/L; same sign, 12/14 folds
    agree on sign, r = 0.704, own-2*SE intervals overlap, and each population's point
    estimate falls inside the other's interval. The two goals are not at cross purposes.
    THREE THINGS THE RUN FOUND THAT THE BEAD DID NOT ASK: (i) the resolution gain is
    2.00x, not 10x -- 102x the decisions (83 -> 8,476) halved the per-fold sd
    (0.7982 -> 0.3992) and no more, because the fold is the independent replicate and
    widening the universe does not create folds; sizing on station-days would have
    reported sqrt(102) ~= 10x and manufactured the improvement under measurement.
    (ii) NEITHER width clears its own fold-clustered interval -- t = 0.98 at five,
    1.27 at 410 -- although both clear the placebo band the dossier actually grades on
    (five: z = -2.330 against a bar of 1.923). Two rulers asking different questions:
    the band asks "could a meaningless column have produced this pooled number", the
    fold-clustered SE asks "does it repeat across folds". The project's headline
    candidate passes the first at both widths and fails the second at both widths, and
    no dossier currently reports the second. (iii) Grading the broad delta against the
    EXTANT five-station band flips the verdict (z -1.544, fails), and the mismatch would
    be silent: compute_noise_floor() accepts station_codes and never stamps it, and
    _bank_admissibility checks baseline_fingerprint / tank_params / null_method / arity
    / partial but has no population axis. Same defect shape as fps-15c's cadence stamp.
  not_tested: >-
    BLOCKED on fps-ajs (itself blocked on fps-916): whether the PLACEBO BAND narrows
    with universe width the way the fold-clustered sd did. Assumed ~2x throughout the
    write-up and load-bearing for the criterion-5 decision -- if it does narrow, the
    broad delta scores ~-3.1 and clears more convincingly than five ever did; if it
    does not, grading broadly is strictly harder for no gain and the decision needs
    revisiting. MEASURABLE NOW, needs fits: whether homogeneity holds for any candidate
    other than tgp_cycle_displacement -- one candidate was run, chosen as the best
    available signal-to-noise; the other four batch1 candidates need the same paired
    run, ~1h each at 410. PERMANENTLY UNTESTABLE by this design: whether the broad and
    five deltas genuinely differ in MAGNITUDE (-0.129 vs -0.208). Disjoint baskets, no
    shared denominator -- deliberately not computed, and no amount of widening makes it
    computable. BLOCKED on fps-wst: whether feature-dark stations materially reweight
    the 410-station pooled CPL. The coverage gate counts daily_prices rows and cannot
    see feature availability by construction -- fold 1 passes the per-window gate at
    0.96 while holding ZERO feature rows for both Blue Mountains stations. NOT DECIDED
    (not a measurement): whether the fold-clustered t should gate anything, given it
    does not clear at either width for the project's cleanest signal.
  outcome: graduated
  calibration: >-
    Pipeline-validation run, and it reproduced its independent reference exactly. The
    five-station arm returned pooled delta_cpl_held = -0.2077 c/L, which is batch1's
    committed headline for this candidate to the digit -- so the widened path is
    measuring the same quantity the dossier does, and nothing above is an artifact of
    homogeneity.py bypassing run_candidate (it must bypass it: r0_cache.joblib is keyed
    only on batch_dir, fps-enx, so calling run_candidate twice at different universes
    would silently overwrite the five-station R0 cache every other batch1 candidate
    depends on). One correction the run forced on its own setup: the fold geometry is
    2021-11-05 .. 2025-04-17 and the eligible pool 410 of 599 across 29 councils
    (digest 410:4a9920301726); a hand derivation gives 2021-11-06 .. 2024-12-29 and
    607/751 across 32, and an earlier draft of the README carried it. Build the spec
    from _plan_folds, never by hand.
  evidence: experiments/2026-09-05_arbiter_universe_width

- candidate: diagnostic — is the WFCV log-loss gain located where the decision rule
    reads it? (no feature under test; batch1/tgp_cycle_displacement as the specimen)
  inputs: [rowpreds.parquet (screen, raw probabilities), r0_cache.joblib (arbiter's
    cached isotonic calibrator + OOF tau)]
  claim: >-
    Both prior TGP expressions improve the WFCV log-loss screen and neither reaches
    the realised arbiter, and the per-fold deltas of the two barely agree (6/14 sign,
    corr -0.176). Asserted cause: the probability improvement lands on rows nowhere
    near tau = 0.25, so the decision rule never consults it -- "it improves a quantity
    the decision rule does not read". If true, the whole TGP track is answered.
  falsified: >-
    The gain is not threshold-remote; it is threshold-INDIFFERENT, and the asserted
    cause is not what separates the two statistics. (1) The ruler in the claim is the
    wrong one: tau = 0.25 is a CALIBRATED threshold, the screen's probabilities are
    RAW, and the equivalent raw threshold is 0.1136-0.1590 across the 14 folds
    (tau = 0.25 exactly on 14/14). Measuring |p_raw - 0.25| aims ~0.10 wide of the
    boundary, into the most gain-dense bin in the profile -- it would have manufactured
    a confirmation. (2) Rows within one isotonic step of tau are 0.83% of rows and carry
    0.8% of the gain: a concentration ratio of 1.01x, i.e. exactly proportional (per-seed
    range 0.02-1.10%, sd 0.43pp). (3) ~4.0% of rows change side of the boundary between
    arms (sd 0.45pp over 5 seeds, flat under a +/-30% tau_raw sweep), 232 of them at the
    arbiter's own five stations -- against the realised run's independently derived
    423 flips / 92 decisions. The decision rule is demonstrably not blind to the feature.
    The claim is true only of the extreme tail: the top 1% by |delta p| sit 3x farther
    from the boundary than a typical row (0.41 vs 0.14) and are 5x under-represented in
    the one-step band, but carry only ~25% of the gain. WHAT ACTUALLY SEPARATES THEM IS
    POPULATION. The screen scores 714 stations; the arbiter replays five; the overlap is
    5,693 of 798,649 rows = 0.71%. Per-fold corr(arbiter delta_cpl, screen delta_ll) is
    -0.096 paired / -0.176 published-convention over all 714 stations (the latter
    reproduces the cited figure exactly, which is the provenance check), and +0.478 /
    +0.543 with the screen restricted to the arbiter's five -- sign agreement 7/14 and
    5/14 versus 10/14 and 11/14. Population is the ONLY change between those rows: same
    model, same folds, same seeds, same statistic. Fold-level bootstrap of the gap
    (20,000 resamples, n=14): +0.574, 95% CI [+0.101, +1.033], P(gap>0) = 0.991. The
    five stations are not special -- their per-row gain (-1.075e-02) sits 0.33 SE from
    the network-wide figure (-1.319e-02) -- they are 141x smaller, and at that size the
    effect fails to clear its own fold-clustered 2*SE (1.459e-02) even on log-loss,
    which is far smoother than realised CPL. So the screen measures the right quantity
    on a population the arbiter mostly cannot act on. CONSEQUENCE FOR THE TRACK: the
    bead's acceptance criterion 4 ("if threshold-remote, close the TGP track") does not
    fire, and closing it on this evidence would be wrong -- nothing here is specific to
    TGP, or to any feature. It is a property of the screen/arbiter seam that every
    candidate in every batch runs through.
  not_tested: >-
    MEASURABLE NOW, no new fit: the same population decomposition for the other four
    batch1 candidates and for batch0 -- every rowpreds.parquet and r0_cache.joblib
    needed is already on disk, so whether the near-zero all-station correlation is
    universal or specific to this candidate is one script away. MEASURABLE NOW, needs
    a fit: the candidate arm's own isotonic calibrator was never cached, so both arms
    here are ruled against R0's tau_raw; refitting it would separate movement of the
    probabilities from relocation of the boundary directly instead of relying on
    own_tau_median = held_tau_median = 0.25 plus a +/-30% sweep. BLOCKED on fps-4z6:
    whether a preferred-five-restricted screen is a usable second indicator depends on
    its own noise band, which nothing computes yet -- it is better ALIGNED but lower
    POWERED, and must not become a graduation gate before that is priced. SUPERSEDED 2026-09-05 by
    2026-09-05_arbiter_universe_width (fps-nas), which was written here as PERMANENTLY
    UNTESTABLE: "the design has 14 folds and no mechanism to widen the replay universe
    without changing what the arbiter is for". The mechanism now exists
    (experiments/lib/universe.py) and the widening was run at 410 stations. The half of
    the line that survives is the fold count: widening bought exactly 2.00x on the
    fold-clustered interval, not sqrt(102)x, because the fold is the replicate and
    widening does not create folds. So the five stations' CPL outcome is measurable at
    102x the decisions and STILL does not clear its own interval (t = 0.98 -> 1.27).
  outcome: rejected
  calibration: >-
    Pipeline-validation run, and it reproduced its independent reference exactly. The
    screen's stored R0/seed-42 raw probabilities were re-derived from the arbiter's
    cached baseline pipeline on folds 1/7/14: max absolute difference 2.980e-08, i.e.
    float32 epsilon (the run asserts < 1e-6 and aborts otherwise). The screen and the
    arbiter are the SAME FIT on the SAME ROWS -- LGBM_DEFAULTS and build_pipeline are
    the same estimator, and _plan_folds walks the same walk_forward_folds geometry --
    so the isotonic map converts between the two probability scales with no fitting and
    no approximation. Two discrepancies were chased to their causes rather than
    tolerated: the published per-fold delta_ll_all_median is a DIFFERENCE OF MEDIANS
    over seeds while the natural paired estimator is the MEDIAN OF DIFFERENCES (they
    differ by up to 0.0127 nats and flip sign on fold 2 -- filed as fps-2kc, every
    correlation above reported under both conventions); and tau = 0.25 is calibrated
    rather than raw, which is Result 1 above.
  evidence: experiments/2026-08-31_tau_distance_of_logloss_gain/

- candidate: tgp_cycle_displacement_cents, tgp_cycle_displacement_frac_amp (wholesale
    floor displacement since the retail cycle's own peak)
  inputs: [price_date, tgp_delta_7d, cycle_days_since_peak, cycle_last_max_cents,
    cycle_last_min_cents]
  claim: >-
    The retail trough is bounded below by the wholesale floor, so how far the
    floor has MOVED since this cycle's retail peak sets how deep this
    particular trough can go. Neither prior TGP expression asks this:
    station_minus_tgp_cents reads today's floor LEVEL (misleading when the
    floor is moving); tgp_delta_7d reads the floor's velocity over a fixed
    7-day window unrelated to where the retail cycle sits. Anchoring the
    displacement to the cycle's own peak makes it a depth-remaining statistic
    instead of a level or a fixed-window momentum term. Predicted signature:
    concentration on NON-SHOCK (normal) folds; a shock-concentrated win was
    explicitly pre-registered as evidence AGAINST this mechanism.
  falsified: >-
    Realised delta -0.2015 c/L held-tau, favourable, and clears batch1's
    single-candidate noise band in the good direction (z=-2.2676 vs
    t=1.9226, graded against a ruler one column wider than the candidate's
    own arity, floor_arity_exceeds_run=true) -- a cleaner clearance than
    either prior TGP expression, both of which sat inside their noise bands.
    But the predicted concentration is inverted: shock folds show a larger
    favourable delta (-0.2884 c/L) than normal folds (-0.1603 c/L), which
    the candidate's own signature names as the specific pattern that would
    refute its wholesale-lead mechanism. [CORRECTED 2026-08-30, fps-hnp:
    regraded against the corrected empirical shock-fold set {1,3,4,14},
    not the original fixed {1,4,9,13} -- the sign relationship and outcome
    are unchanged, but the specific numbers and driving fold are not.] The
    shock aggregate is not even a clean shock story on its own terms -- 2
    of 4 shock folds (1, 14) hurt the candidate, and fold 3 alone
    (-1.09 c/L) drives most of the favourable shock number (excluding it
    flips the shock-zone delta to +0.005 c/L). Max per-column R^2 against
    the 49-column lock is 0.583, concentrated entirely in the
    days_since_trough_entry_* LGA family, and the one candidate-arm
    seed-instability flag (fold 3, hard25 cohort) now lands in exactly the
    fold that alone drives the shock-zone reading (fold 3 was `normal`
    under the original fixed shock-fold set).
  not_tested: >-
    Whether the shock-fold gain is fold-3-specific (named fold 13 before
    the 2026-08-30 shock-fold correction, fps-hnp; fold 13 is now
    `normal`) rather than a genuine shock mechanism -- 2 of 4 shock folds
    actually hurt the candidate. Whether testing the actual claim -- decision timing keyed to the
    MAGNITUDE of floor displacement since the peak, not the coarse
    shock/normal regime label -- would recover the predicted normal-fold
    concentration; no per-axis breakdown by displacement magnitude was built
    for this run. Whether the ~58% max per-column R^2 against the lock
    (concentrated entirely in days_since_trough_entry_*) means this is
    substantially a proxy for existing trough-timing columns rather than new
    information. Per fps-1l1: whether the model's own SHAP orientation would
    corroborate or refute the wholesale-lead story -- facts.json has no
    field for this, so the mechanism itself, as opposed to the
    regime-location prediction, is untestable with this pipeline as built.
  outcome: rejected
  evidence: experiments/candidates/batch1/tgp_cycle_displacement/

- candidate: sticky_x_phase, abs_sticky_x_phase (stickiness x cycle-phase product,
    signed and absolute)
  inputs: [stickiness_score, cycle_pct_through]
  claim: >-
    cycle_pct_through is a NETWORK clock (one value per date), but a
    station's willingness to follow it is per-station: a chronically cheap,
    competitive station tracks the cycle closely, a chronically dear or
    erratic one is only loosely coupled. The lock hands the model both
    terms separately and nothing else; a tree can only approximate their
    product through nested axis-aligned splits. Predicted decision-timing:
    near-zero stickiness stations essentially unchanged, flips concentrated
    on the stickiness-distribution tails, buying EARLIER on high-|stickiness|
    stations at late phase, and -- the distinctive signature -- SIGNED and
    ABSOLUTE columns both used and disagreeing in orientation somewhere in
    the SHAP surface (if only the absolute column is used, the real content
    is a weaker "outliers are decoupled" claim, not a saddle).
  falsified: >-
    Yes, as constructed -- and the mechanism is located, which the original
    2026-08-27 entry did not establish. Realised delta -0.0735 c/L held-tau
    (favourable direction) sits inside batch1's single-candidate noise band
    on THREE independently-built rulers, not one: z=-0.99 against the arity-3
    bank it was graded on, -0.81 against noise_floor_k1.json (arity 1, 20
    draws), -0.88 against noise_floor_icc.json -- all matching fingerprint
    54:1a6ec2d84a69 and tank params, all far inside t=1.92. An arity-2 band
    sits between the arity-1 and arity-3 banks by construction, so
    floor_arity_exceeds_run has no route to move this call. A 2026-08-29
    flip-level review found the predicted mechanism IS real but mispriced:
    on flips landing within 3 days of a >=15 c/L rise the candidate's
    litres-weighted 7d regret is 0.33 c/L vs the baseline's 21.62, spread
    across folds 2/3/8/10/13 -- but turn-adjacent fills are only 150 of 2982
    flipped litres (~5%) and the candidate is 0.88 c/L WORSE across the other
    95%, so litres-weighted regret over all flips is 6.21 vs 6.22, a dead
    heat. That is why the delta is ~0. The candidate's OWN distinguishing
    signature (signed vs absolute disagreement in the SHAP surface) was never
    run and never will be: fps-1l1 closed 2026-08-27 deciding no SHAP field
    will exist in facts.json, and dossier.md now grades SHAP-shaped
    signatures inconclusive on sight -- a defect in how the claim was phrased,
    not a pipeline gap (see fps-i2o). Do not re-propose this construction.
  not_tested: >-
    Whether a turn-GATED construction pays -- the live successor, filed as
    fps-3jj.10 lead 6. Nothing here tests a version inert outside turn
    conditions, and the open sub-question is what a PIT-safe turn gate is
    built from: the review's turn definition is forward-looking (max price
    over the next 3 days), a diagnostic and not a constructible feature. If
    the same-day proxy fires on the wrong 5% of rows the edge inverts, since
    ordinary conditions are where this candidate already loses. Also still
    open: whether flips concentrate on the tails of the STICKINESS
    distribution specifically -- decision_flips carries no station-level
    stickiness data, so the mechanism was localised by market condition
    (cycle turns) rather than by station type, and the stickiness-tail
    formulation remains unmeasured. NOT open, despite the original entry
    saying so: the SHAP signature (permanently untestable, fps-1l1) and the
    same-arity floor (answered above from committed banks, see fps-30p).
    Power caveat on the mechanism finding: n=11 candidate / n=8 baseline
    turn-adjacent flips, the two arms' flips fall on different days (two
    decision sets, not a paired test), and 303 flips are ~87 independent
    decisions once cascades are collapsed -- the effect-size conclusion is
    solid, the localisation is suggestive and under-powered.
  outcome: inconclusive
  evidence: experiments/candidates/batch1/stickiness_phase_saddle/

- candidate: lga_trough_breadth_7d, lga_trough_breadth_delta_3d, lga_leader_lead_days
    (cross-sectional breadth/velocity/leader-lag over the 35 LGA trough clocks)
  inputs: [price_date, days_since_trough_entry_bayside, days_since_trough_entry_blacktown,
    days_since_trough_entry_blue_mountains, days_since_trough_entry_botany_bay,
    days_since_trough_entry_burwood, days_since_trough_entry_camden,
    days_since_trough_entry_campbelltown, days_since_trough_entry_canada_bay,
    days_since_trough_entry_canterbury_bankstown, days_since_trough_entry_cumberland,
    days_since_trough_entry_fairfield, days_since_trough_entry_georges_river,
    days_since_trough_entry_hawkesbury, days_since_trough_entry_hornsby,
    days_since_trough_entry_hunters_hill, days_since_trough_entry_inner_west,
    days_since_trough_entry_ku_ring_gai, days_since_trough_entry_lane_cove,
    days_since_trough_entry_liverpool, days_since_trough_entry_mosman,
    days_since_trough_entry_north_sydney, days_since_trough_entry_northern_beaches,
    days_since_trough_entry_parramatta, days_since_trough_entry_penrith,
    days_since_trough_entry_randwick, days_since_trough_entry_rockdale,
    days_since_trough_entry_ryde, days_since_trough_entry_strathfield,
    days_since_trough_entry_sutherland_shire, days_since_trough_entry_sydney,
    days_since_trough_entry_the_hills_shire, days_since_trough_entry_waverley,
    days_since_trough_entry_willoughby, days_since_trough_entry_wollondilly,
    days_since_trough_entry_woollahra]
  claim: >-
    The Sydney trough is a wave, not a moment: individual LGAs bottom on
    different days and the wave runs from a known set of early LGAs outward.
    lga_phase_std (family C, graduated) is a dispersion statistic over the
    same 35 clocks -- sign-blind and order-blind, so it can't tell "a third
    of the network has just bottomed, the rest about to follow" from "a third
    bottomed six weeks ago, the rest mid-descent." Breadth, its velocity, and
    the leaders' head start recover exactly what the std discards, predicting
    earlier WAIT->BUY flips concentrated on non-shock folds (a shock's
    wholesale move overrides propagation order).
  falsified: >-
    NOT falsified as of the 2026-08-30 shock-fold correction (fps-hnp) --
    CONFIRMED. Originally read as falsified against the fixed shock-fold
    set {1,4,9,13}: zone resolved=false, target(normal) slightly worse
    (+0.0463), the whole favourable effect in the zone predicted inert
    (shock, -0.3794). Regraded against the corrected empirical set
