    triple-stack that only aligns in fold-9-like windows: late descent is the
    model's hardest zone, the lookup is structurally noisy in the pct>1 tail, and
    cycle elongation pushes trough-proximity INTO that tail. The tail is also
    selection-biased — rows with pct>1.5 exist only for cycles that ran 1.5x
    without re-peaking, i.e. prior shock episodes, which do not generalise to new
    ones.
  not_tested: >-
