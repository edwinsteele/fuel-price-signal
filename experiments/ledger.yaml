# Negative-results ledger
#
# Machine-readable residue of every candidate feature this project has tested.
# Consumed by the generator session (fps-3jj.7) so it does not re-propose dead
# ground and can see where room remains.
#
# Newest-first, matching experiments/INDEX.md. INDEX.md remains the prose lab
# book; this file is the structured claim record. Neither is derived from the
# other — the dossier routine writes both in the same pass.
#
# KEYED ON THE CLAIM, NOT THE FEATURE NAME. `inputs` (what data) is held
# separately from `claim` (what was asserted), because a rejected claim over a
# data source does not condemn the source: station_minus_tgp_cents was rejected
# but tgp_delta_7d graduated off the same TGP series.
#
# Fields:
#   candidate   - the column(s) or change under test
#   inputs      - what data it reads
#   claim       - the mechanism asserted, in price-formation terms
#   falsified   - what the run actually showed (empty for graduates)
#   not_tested  - adjacent ground this run did NOT rule out. The field that
#                 stops the generator being timid. Requires real judgement.
#   outcome     - graduated | rejected | superseded | disqualified
#                 | aborted_candidate | aborted_environment
#   superseded_by - (only with outcome: superseded) what later work invalidated
#                 this run's verdict, and what the corrected reading is. The run
#                 itself is left in place — its numbers are still a factual
#                 record of what that configuration produced.
#   evidence    - experiment dir
#
# `superseded` is NOT `rejected`. A rejected claim is dead ground the generator
# should not re-propose; a superseded one was measured wrong or measured below
# the instrument's resolution, and the ground may still be open. Read
# `superseded_by` before deciding. First use: batch0/tgp_delta_7d, 2026-08-19.
#
# Entries below 2026-08-17 were hand-backfilled from experiment READMEs and
# analysis.md files (bd fps-3jj.3). Later entries are pipeline-generated.

- candidate: tgp_delta_7d
  inputs: [tgp_delta_7d]
  claim: >-
    7-day AIP Sydney TGP (wholesale floor) momentum predicts near-term retail
    descent, concentrating in shock regimes where today's wholesale-floor
    position alone misleads. AI-sourced pipeline's held-out re-lock check
    (batch0) on the claim that graduated the arbiter 2026-06-22.
  falsified: >-
    Pooled realised Δcpl is +0.0941 c/L (r0 189.66 → candidate 189.7541) —
    opposite the predicted negative sign, failing the batch's pre-registered
    sign+concentration criterion on sign alone. Harm DOES concentrate in shock
    as predicted (shock +0.272 vs normal +0.009) but as a cost, not the
    rescue of the raw gap's known shock weakness — and that pooled shock
    number is driven almost entirely by one fold (fold 13, +1.09, not
    seed-flagged); the other 3 shock folds are flat/mildly helpful. WFCV
    log-loss favours the candidate (descriptive colour only, doesn't move the
    arbiter). Diagnostic re-run 2026-08-18 with an `.asof`-by-date provider
    (matching June's `extra_feature_provider` closure exactly, ruling out the
    `add_columns` exact-key-lookup plumbing as an explanation) reproduced
    this result BIT-IDENTICALLY (910/910 hits vs the harness's 822/88, same
    delta to the decimal, same per-fold table) — the rejection is not a
    pipeline implementation artifact.
  superseded_by: >-
    2026-08-19 (bd fps-nor). This run's R0 was NOT the production baseline:
    batch_freeze.resolve_baseline_columns() appended
    discover_brand_feature_columns(df), so R0 = the locked 54 PLUS the 10
    Phase 4b brand-trough columns that were evaluated and REJECTED on
    2026-06-02. Fixed in bd fps-sa1 (PR #309). Rerun on the same frozen
    snapshot with the correct 54-col baseline gives pooled delta_cpl_held
    = +0.0059 c/L — inert, not a rejection. Attribution of the
    -0.0394 -> +0.0941 swing: baseline composition +0.0882, data vintage
    +0.0453. The R0_64 anchor reproduced 189.6600 exactly, so the original
    run is faithfully reproduced; only its baseline was wrong.
    ALSO: the pooled number is below the instrument's resolution. Per-fold
    pooled contributions span -0.21 to +0.65 c/L for a +0.006 total; the two
    arms differ on 11/752 fills; one decision flip is worth ~0.05 c/L pooled
    — larger than the -0.039 that graduated this feature in June. -0.0394,
    +0.0059 and +0.0941 are all within a couple of flips of zero.
  not_tested: >-
    What the noise floor actually IS (fps-3jj.9) — now the blocking question;
    this run gives a first handle (one flip ~ 0.05 c/L pooled) but a real band
    needs a placebo/shuffle distribution, not one paired run. Why the 54-col
    baseline improved 0.1206 c/L between June's vintage and the 2026-08-10
    snapshot (always_cpl identical to the decimal, feature code barely changed
    — plausible mechanism is gap-fill adding historical rows for stations
    outside the 50 preferred, feeding the LGA/network/stickiness aggregates;
    unproven). Fold 3's seed instability (~280x cohort median). Fold 13's
    idiosyncrasy is MOOT — its dominance was an artifact of the 64-col
    baseline (+1.09 there, +0.127 on the correct one).
  outcome: superseded
  evidence: experiments/candidates/batch0/tgp_delta_7d

- candidate: tgp_delta_7d
  inputs: [AIP Sydney ULP terminal gate price, price_date]
  claim: >-
    The 7-day velocity of the wholesale floor leads retail: when the floor is
    moving up fast, buy before the pump follows.
  falsified: ""
  not_tested: >-
    MA-smoothing of the velocity (parked — 7d point-to-point already beat 3d, so
    smoothing was never run). Horizons between 7 and 14 days. Whether velocity of
    a *different* upstream series (crude, Singapore Mogas) carries the same signal
