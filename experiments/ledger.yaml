- candidate: non-parametric phase lookup, E[norm_price | phase] per fold
  inputs: [cycle_pct_through, station_price_cents, cycle_last_min_cents, cycle_last_max_cents]
  claim: >-
    Replacing the linear-interp diagonal projection with a learned per-fold
    empirical shape fixes the predecessor's shock-fold fragility — the problem was
    shape misspecification, not the concept.
  falsified: >-
    Shape correction was REAL but did not flip the verdict (fold 9 improved +0.101
    -> +0.066). Two separate failures: additive (51 feat) is EXACTLY neutral
    (normal-fold median +0.0004), meaning the residual adds nothing the sibling
    features do not already carry — trees were already building phase-residual-like
    splits. And ablationA (drop siblings, add lookup) regresses badly, because the
    siblings are pct-invariant anchors ("n cents above the recent trough" regardless
    of whether the cycle ran 25 or 50 days) and the lookup is not. Mechanism is a
    triple-stack that only aligns in fold-9-like windows: late descent is the
    model's hardest zone, the lookup is structurally noisy in the pct>1 tail, and
    cycle elongation pushes trough-proximity INTO that tail. The tail is also
    selection-biased — rows with pct>1.5 exist only for cycles that ran 1.5x
    without re-peaking, i.e. prior shock episodes, which do not generalise to new
    ones.
  not_tested: >-
    Nothing on the diagonal-projection axis is worth retesting — the track is
    closed, including clip-point sensitivity. The durable constraint for anything
    downstream: no phase-residual variant should be pursued without an architecture
    that PRESERVES the absolute anchors. Left genuinely open: the
    stickiness x cycle_pct_through opposite-orientation saddle, surfaced
    unexpectedly in step 1 and never pursued.
  outcome: rejected
  evidence: experiments/2026-06-05_phase_lookup_nonparametric/

